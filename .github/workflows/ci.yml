name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # CAM++ 模型(28 MB)按 fetch-model.mjs 里的 sha256 缓存,脚本校验通过即跳过下载
      - uses: actions/cache@v6
        with:
          path: public/models/campplus.onnx
          key: campplus-${{ hashFiles('scripts/fetch-model.mjs') }}
      - run: npm ci
      - run: npm test
      # fetch-model + tsc --noEmit + vite build
      - run: npm run build
      # 端到端测试跑在上一步的 dist/ 上
      - run: npx playwright install --with-deps chromium
      # 端到端测试用 ffmpeg 的 flite 合成多人说话的测试音频(Ubuntu 的 ffmpeg 带 libflite)
      - run: sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -hide_banner -filters | grep -q flite
      - run: npm run e2e
      # 失败时上传截图和错误上下文,在 Actions 页面下载查看
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
